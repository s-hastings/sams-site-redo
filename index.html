<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sam Hastings — Portfolio</title>
<meta name="description" content="Portfolio of Sam Hastings. Walk through a moonlit field of glyphs to find the work.">
<meta name="theme-color" content="#05080a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05080a;
    --ink: #e8eee9;
    --dim: rgba(232, 238, 233, 0.56);
    --faint: rgba(232, 238, 233, 0.28);
    --mint: #7fe3c0;
    --amber: #f3c97f;
    --panel: rgba(5, 11, 11, 0.74);
    --line: rgba(232, 238, 233, 0.1);
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--mint); outline-offset: 3px; }

  #field, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #field { cursor: crosshair; touch-action: none; }
  #fx { pointer-events: none; }

  /* World-anchored labels */
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .nametag {
    position: absolute; left: 0; top: 0;
    font-family: var(--sans); font-weight: 500; font-size: 17px; letter-spacing: 0.01em;
    color: #f4f6f3; white-space: nowrap;
    text-shadow: 0 0 14px rgba(0,0,0,0.95), 0 0 3px rgba(0,0,0,0.9);
    opacity: 0; transition: opacity 1.4s ease;
  }
  .nametag.on { opacity: 1; }
  .mlabel {
    position: absolute; left: 0; top: 0; pointer-events: auto;
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--amber); white-space: nowrap;
    text-shadow: 0 0 10px rgba(0,0,0,1), 0 0 2px rgba(0,0,0,1);
    transition: opacity .3s ease;
  }
  .mlabel span { color: var(--faint); margin-right: .6em; }
  .mlabel:hover { color: #fff1d4; }

  /* Chrome */
  .top {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
    padding: max(20px, env(safe-area-inset-top)) 24px 0;
    pointer-events: none;
    text-shadow: 0 0 12px rgba(0,0,0,0.9);
  }
  .top > * { pointer-events: auto; }
  .brand { font-weight: 500; text-decoration: none; letter-spacing: 0.02em; }
  .role { color: var(--dim); }
  .top nav { margin-left: auto; display: flex; gap: 20px; }
  .top nav button { color: var(--dim); letter-spacing: 0.04em; }
  .top nav button:hover, .top nav button[aria-expanded="true"] { color: var(--ink); }
  .top nav button::before { content: "["; color: var(--faint); margin-right: 2px; }
  .top nav button::after { content: "]"; color: var(--faint); margin-left: 2px; }

  .hud {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: space-between; gap: 16px;
    padding: 0 24px max(18px, env(safe-area-inset-bottom));
    color: var(--dim); font-size: 11px; letter-spacing: 0.06em;
    pointer-events: none; text-shadow: 0 0 10px rgba(0,0,0,1);
  }
  #coords { font-variant-numeric: tabular-nums; }

  /* Project panel (opens when you reach a light) */
  .panel {
    position: fixed; right: 24px; top: 50%;
    width: min(360px, calc(100vw - 48px));
    transform: translate(16px, -50%); opacity: 0; visibility: hidden;
    transition: opacity .35s ease, transform .35s ease, visibility 0s linear .35s;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: 22px 22px 20px;
  }
  .panel.open { opacity: 1; visibility: visible; transform: translate(0, -50%); transition-delay: 0s; }
  .panel .idx { color: var(--amber); font-size: 11px; letter-spacing: 0.14em; }
  .panel h2 { font-family: var(--sans); font-weight: 500; font-size: 22px; line-height: 1.2; margin: 10px 0 4px; }
  .panel .meta { color: var(--dim); font-size: 11.5px; }
  .panel p { color: rgba(232,238,233,0.82); line-height: 1.65; margin: 16px 0; font-size: 12.5px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; padding: 0; list-style: none; }
  .tags li { border: 1px solid var(--line); color: var(--dim); padding: 3px 7px; font-size: 10.5px; }
  .cta { display: inline-flex; gap: 8px; color: var(--mint); text-decoration: none; font-size: 12px; letter-spacing: 0.04em; }
  .cta:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* Sheets: work list, about, contact */
  .sheet {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(3, 6, 7, 0.62);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden;
    transition: opacity .3s ease, visibility 0s linear .3s;
    padding: 80px 16px;
  }
  .sheet.open { opacity: 1; visibility: visible; transition-delay: 0s; }
  .sheet .inner { width: min(640px, 100%); max-height: 100%; overflow: auto; }
  .sheet h2 { font-weight: 400; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); margin: 0 0 22px; }
  .worklist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .worklist li { border-bottom: 1px solid var(--line); }
  .worklist button {
    width: 100%; display: grid; grid-template-columns: 3ch 1fr auto; gap: 18px; align-items: baseline;
    text-align: left; padding: 16px 2px;
  }
  .worklist .n { color: var(--faint); }
  .worklist .t { font-family: var(--sans); font-size: 19px; }
  .worklist .y { color: var(--dim); font-size: 11px; }
  .worklist button:hover .t { color: var(--amber); }
  .worklist .walk { display: block; font-family: var(--mono); font-size: 11px; color: var(--faint); margin-top: 4px; }
  .about p { font-family: var(--sans); font-size: 19px; line-height: 1.6; margin: 0 0 22px; color: rgba(232,238,233,0.9); }
  .about dl { display: grid; grid-template-columns: 12ch 1fr; gap: 10px 18px; margin: 28px 0 0; color: var(--dim); }
  .about dt { color: var(--faint); }
  .about dd { margin: 0; }
  .contact a { display: block; font-family: var(--sans); font-size: 24px; text-decoration: none; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .contact a:hover { color: var(--mint); }
  .close { position: fixed; top: max(20px, env(safe-area-inset-top)); right: 24px; color: var(--dim); }
  .close:hover { color: var(--ink); }

  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 700px) {
    body { font-size: 12px; }
    .top { padding: max(16px, env(safe-area-inset-top)) 16px 0; gap: 4px 14px; }
    .role { display: none; }
    .top nav { gap: 14px; }
    .hud { padding: 0 16px max(14px, env(safe-area-inset-bottom)); }
    #coords { display: none; }
    .panel {
      right: 16px; left: 16px; top: auto; bottom: max(44px, calc(env(safe-area-inset-bottom) + 34px));
      width: auto; transform: translateY(16px);
    }
    .panel.open { transform: none; }
    .about p { font-size: 16px; }
    .about dl { grid-template-columns: 1fr; gap: 2px; }
    .about dd { margin-bottom: 10px; }
    .close { right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .panel, .sheet, .nametag { transition: none; }
  }
</style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" href="#" id="brand">sam hastings</a>
    <span class="role" id="role">designer &amp; developer</span>
    <nav aria-label="Main">
      <button type="button" data-open="work" aria-expanded="false" aria-controls="work">work</button>
      <button type="button" data-open="about" aria-expanded="false" aria-controls="about">about</button>
      <button type="button" data-open="contact" aria-expanded="false" aria-controls="contact">contact</button>
    </nav>
  </header>

  <aside class="panel" id="project" aria-live="polite" aria-label="Project">
    <div class="idx" id="p-idx"></div>
    <h2 id="p-title"></h2>
    <div class="meta" id="p-meta"></div>
    <p id="p-desc"></p>
    <ul class="tags" id="p-tags"></ul>
    <a class="cta" id="p-link" href="#" target="_blank" rel="noopener">view project <span aria-hidden="true">→</span></a>
  </aside>

  <section class="sheet" id="work" aria-label="Work" aria-hidden="true">
    <div class="inner">
      <h2>Selected work — pick one and walk there</h2>
      <ul class="worklist" id="worklist"></ul>
    </div>
  </section>

  <section class="sheet" id="about" aria-label="About" aria-hidden="true">
    <div class="inner about" id="aboutbody"></div>
  </section>

  <section class="sheet" id="contact" aria-label="Contact" aria-hidden="true">
    <div class="inner contact">
      <h2>Say hello</h2>
      <div id="contactlinks"></div>
    </div>
  </section>

  <button type="button" class="close" id="close" hidden>[ close ]</button>

  <footer class="hud">
    <span class="hint" id="hint">click to walk · scroll to zoom · follow the lights</span>
    <span id="coords" aria-hidden="true"></span>
  </footer>

<script>
/* ──────────────────────────────────────────────────────────────
   Edit your content here.
   ────────────────────────────────────────────────────────────── */
const SITE = {
  name: "Sam Hastings",
  role: "designer & developer",
  about: [
    "I design and build things for the web — interfaces, tools and the occasional strange experiment like this field.",
    "I care about craft, motion and making software feel calm. Currently open to new projects and collaborations."
  ],
  facts: [
    ["based in", "Somewhere, Earth"],
    ["focus", "Product design, front-end, creative coding"],
    ["tools", "Figma, TypeScript, React, WebGL, Canvas"],
    ["currently", "Taking on freelance work for 2027"]
  ],
  email: "hello@example.com",
  links: [
    ["GitHub", "https://github.com/s-hastings"],
    ["LinkedIn", "https://www.linkedin.com/"],
    ["Read.cv", "https://read.cv/"]
  ],
  // `at` = [which path (0 or 1), distance along it]. Lights sit beside the path.
  projects: [
    { title: "Lumen", year: "2026", kind: "Product design · Web app",
      desc: "A calm reading app that turns saved articles into a weekly print-style digest. Led design and built the front-end.",
      tags: ["Figma", "React", "Typography"], url: "#", at: [0, 620] },
    { title: "Fieldnotes", year: "2025", kind: "Creative coding",
      desc: "Generative ASCII landscapes rendered in the browser — the experiment that grew into this site.",
      tags: ["Canvas", "Noise", "Shaders"], url: "#", at: [0, 1060] },
    { title: "Harbor", year: "2025", kind: "Design system",
      desc: "A component library and token pipeline shared across four product teams, with docs people actually read.",
      tags: ["Tokens", "Storybook", "Accessibility"], url: "#", at: [1, 560] },
    { title: "Tidewater", year: "2024", kind: "Brand · Website",
      desc: "Identity and marketing site for a small coastal coffee roaster. Hand-drawn type, lots of blue.",
      tags: ["Branding", "Astro", "Motion"], url: "#", at: [1, -600] },
    { title: "Signal", year: "2023", kind: "Data visualisation",
      desc: "A live dashboard for a city transit agency that turns thousands of bus pings into one readable map.",
      tags: ["D3", "Maps", "Realtime"], url: "#", at: [0, 1500] }
  ]
};
</script>

<script>
(() => {
"use strict";

/* ── Setup ─────────────────────────────────────────────────── */
const canvas = document.getElementById("field");
const fxCanvas = document.getElementById("fx");
const fx = fxCanvas.getContext("2d");
let gpu = null, ctx = null; // WebGL2 renderer, or a 2D canvas fallback (set up below)
const labelsEl = document.getElementById("labels");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

document.getElementById("brand").textContent = SITE.name.toLowerCase();
document.getElementById("role").textContent = SITE.role;
document.title = SITE.name + " — Portfolio";

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const TAU = Math.PI * 2;

/* Integer hash → [0,1) */
function h2(x, y, s) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(s | 0, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
/* Smooth value noise → [0,1) */
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h2(xi, yi, s), b = h2(xi + 1, yi, s), c = h2(xi, yi + 1, s), d = h2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

/* ── World: paths, trees, shadows ─────────────────────────── */
const PATHS = [
  { ang: -0.30, off: 0,    a1: 110, f1: 1 / 640, a2: 36, f2: 1 / 230, w: 36 },
  { ang: 1.20,  off: -420, a1: 90,  f1: 1 / 520, a2: 30, f2: 1 / 170, w: 30 }
];
const PATH0_START = -330;
let pathDist = 0; // side output of pathField: signed distance to nearest path edge
function pathField(x, y) {
  let m = 0; pathDist = 1e9;
  for (let i = 0; i < PATHS.length; i++) {
    const p = PATHS[i], c = Math.cos(p.ang), s = Math.sin(p.ang);
    const u = x * c + y * s;
    const v = -x * s + y * c - p.off;
    const center = p.a1 * Math.sin(u * p.f1) + p.a2 * Math.sin(u * p.f2 + 1.3);
    const d = Math.abs(v - center);
    const w = p.w * (0.78 + 0.44 * vnoise(u * 0.012, i * 7.3, 7));
    const fade = i === 0 ? clamp01((u - PATH0_START) / 40) : 1;
    if (fade <= 0) continue;
    const k = clamp01((w - d) / 24 + 0.5) * fade;
    if (k > m) m = k;
    if (d - w < pathDist) pathDist = d - w;
  }
  return m;
}
function pathPoint(i, u, side) {
  const p = PATHS[i], c = Math.cos(p.ang), s = Math.sin(p.ang);
  const v = p.off + p.a1 * Math.sin(u * p.f1) + p.a2 * Math.sin(u * p.f2 + 1.3) + side;
  return { x: u * c - v * s, y: u * s + v * c };
}

const SPAWN = pathPoint(0, 0, 0);
const MARKERS = SITE.projects.map((p, i) => {
  const pt = pathPoint(p.at[0], p.at[1], (i % 2 ? -1 : 1) * 96);
  return { ...p, i, x: pt.x, y: pt.y, glow: 0 };
});

const SUN_X = 0.89, SUN_Y = 0.46;         // shadow direction (sun/moon from upper-left)
const SHADOW_LEN = 1.25;

/* ── The tower: a mossy ruin at the end of the path (holds the About card) ── */
const DOOR = pathPoint(0, PATH0_START, 0);
const TOWER = (() => {
  const w = 300, fh = 480, rd = 230, x = DOOR.x, y = DOOR.y + 10;
  const L = fh * 1.15;
  return { x, y, w, fh, rd, L, x0: x - w / 2, x1: x + w / 2, roofY: y - fh, top: y - fh - rd,
           sx1: x + w / 2 + SUN_X * L, sy1: y + SUN_Y * L };
})();
const ABOUT_SPOT = { about: true, x: DOOR.x, y: DOOR.y + 44 };
let TB = 0, TCH = 0; // side outputs of towerSample: brightness, glyph
function mossAt(x, y) { return vnoise(x * 0.016, y * 0.016, 50) * 0.7 + vnoise(x * 0.05, y * 0.05, 51) * 0.3; }
/* 0 = not tower, 1 = stone glyph, 2 = moss stroke, 3 = dark (door, slits, mortar) */
function towerSample(wx, wy, gx, gy) {
  const t = TOWER;
  if (wx < t.x0 || wx > t.x1 || wy < t.top || wy > t.y) return 0;
  const edgeD = Math.min(wx - t.x0, t.x1 - wx, wy - t.top);
  if (edgeD < 14 * vnoise(wx * 0.07, wy * 0.07, 60)) return 0; // crumbling silhouette
  const dx = wx - t.x, lx = dx / (t.w / 2), h = t.y - wy;
  const onRoof = wy <= t.roofY;

  // door and arrow slits stay pitch dark
  if (!onRoof) {
    if (Math.abs(dx) < 36 && (h < 92 || dx * dx + (h - 92) * (h - 92) < 1296)) return 3;
    for (const sx of [-82, 0, 82]) {
      const ex = dx - sx, eh = h - (sx ? 280 : 330);
      if (Math.abs(ex) < 5 && ((eh > 0 && eh < 50) || (eh >= 50 && ex * ex + (eh - 50) * (eh - 50) < 25))) return 3;
    }
  }

  // moss: blotches plus per-column drips that hang down the wall
  const drip = 46 * h2(gx, 0, 52);
  let moss = Math.max(mossAt(wx, wy), mossAt(wx, wy - drip) * 0.95);
  if (!onRoof) moss += 0.16 * clamp01(1 - h / (t.fh * 0.5));
  if (edgeD < 26) moss += 0.08;
  if (onRoof && (t.roofY - wy) < 26) moss += 0.1;
  if (moss > 0.69) { const r2 = h2(gx, gy, 53); TB = 0.18 + 0.55 * r2 * r2 + (moss - 0.69) * 1.4; return 2; }

  const r = h2(gx, gy, 42);
  TCH = STONE_IX[(r * STONE_IX.length) | 0];
  if (onRoof) {
    const ry = wy - t.top, by = t.roofY - wy, bxl = wx - t.x0, bxr = t.x1 - wx;
    const pd = Math.min(bxl, bxr, ry, by);
    if (pd < 17) { // crenellated parapet
      const along = (pd === ry || pd === by) ? wx : wy;
      const merlon = (Math.floor((along + 400) / 26) & 1) === 0;
      TB = merlon ? 0.85 + 0.15 * r : 0.38;
      if (pd > 14) TB *= 0.4;
      return 1;
    }
    const fx = (wx - t.x0) % 30, fy = (wy - t.top) % 30;
    if (fx < 2.5 || fy < 2.5) return 3;
    TB = 0.3 + 0.18 * h2(Math.floor((wx - t.x0) / 30), Math.floor((wy - t.top) / 30), 43);
    if (ry < 44 || bxl < 40) TB *= 0.55; // parapet shadow on the floor
    return 1;
  }
  if (h > t.fh - 12) { TB = 0.95; TCH = CHAR_IX[r < 0.5 ? "=" : "#"]; return 1; } // cornice
  if (h > t.fh - 22) { TB = 0.3; return 1; }
  const row = Math.floor(h / 20), off = (row & 1) * 21;
  const bx = dx + 500 + off, fx = bx % 42, fy = h % 20;
  if (fx < 2.4 || fy < 2.2) return 3; // mortar
  TB = (0.55 + 0.3 * h2(Math.floor(bx / 42), row, 41) - 0.2 * lx + 0.1 * (h / t.fh)) * (0.55 + 0.45 * clamp01(h / 90));
  if (r < 0.06) return 3; // cracks
  return 1;
}
function inTowerShadow(wx, wy) {
  const t = TOWER;
  if (wx < t.x0 || wx > t.sx1 || wy < t.y - t.rd || wy > t.sy1) return false;
  const lo = Math.max(0, (wx - t.x1) / SUN_X, (wy - t.y) / SUN_Y);
  const hi = Math.min(t.L, (wx - t.x0) / SUN_X, (wy - (t.y - t.rd)) / SUN_Y);
  return lo <= hi;
}
const TSX = 250, TSY = 560;               // tree grid spacing
const treeCache = new Map();
function treeAt(gx, gy) {
  const key = gx * 100003 + gy;
  if (treeCache.has(key)) return treeCache.get(key);
  let t = null;
  if (h2(gx, gy, 11) < 0.78) {
    const x = (gx + (gy & 1) * 0.5 + 0.25 + 0.5 * h2(gx, gy, 12)) * TSX;
    const y = (gy + 0.2 + 0.6 * h2(gx, gy, 13)) * TSY;
    const h = 300 + 170 * h2(gx, gy, 14);
    const w = h * (0.16 + 0.04 * h2(gx, gy, 15));
    const trunk = 26 + 16 * h2(gx, gy, 16);
    pathField(x, y);
    let ok = pathDist > w * 0.8 + 6;
    if (ok && Math.hypot(x - SPAWN.x, y - SPAWN.y) < 170) ok = false;
    if (ok && waterField(x, y) > -w * 0.6 - 12) ok = false;
    if (ok && x > TOWER.x0 - w - 20 && x < TOWER.x1 + w + 20 && y > TOWER.top - 30 && y < TOWER.y + 90) ok = false;
    for (const m of MARKERS) if (ok && Math.hypot(x - m.x, y - m.y) < 190) ok = false;
    if (ok) {
      const L = h * SHADOW_LEN;
      t = { x, y, h, w, trunk, L, seed: (gx * 31 + gy * 17) & 1023,
            cx0: x - w * 1.3, cx1: x + w * 1.3, cy0: y - h - 6, cy1: y + 2,
            sx0: x - w * 1.2, sx1: x + SUN_X * L + w * 1.2, sy0: y - w * 1.2, sy1: y + SUN_Y * L + w * 1.2 };
    }
  }
  treeCache.set(key, t);
  return t;
}
/* ── Water: a river and a pond, plus a ripple simulation ──── */
const RIVER = { ang: 1.05, a1: 120, f1: 1 / 700, a2: 40, f2: 1 / 260, w: 96, off: 0 };
const RC = Math.cos(RIVER.ang), RS = Math.sin(RIVER.ang);
{
  const A = pathPoint(0, 880, 0);
  const u = A.x * RC + A.y * RS, v = -A.x * RS + A.y * RC;
  RIVER.off = v - (RIVER.a1 * Math.sin(u * RIVER.f1) + RIVER.a2 * Math.sin(u * RIVER.f2 + 0.4));

const POND = { x: SPAWN.x + 150, y: SPAWN.y + 330, r: 175 };
/* > 0 inside water (≈ distance to the shore), < 0 on land */
function waterField(x, y) {
  const u = x * RC + y * RS, v = -x * RS + y * RC - RIVER.off;
  const cen = RIVER.a1 * Math.sin(u * RIVER.f1) + RIVER.a2 * Math.sin(u * RIVER.f2 + 0.4);
  const rv = RIVER.w * (0.8 + 0.4 * vnoise(u * 0.008, 3.1, 70)) - Math.abs(v - cen);
  const dx = x - POND.x, dy = y - POND.y;
  const pv = POND.r * (0.72 + 0.56 * vnoise(x * 0.007, y * 0.007, 71)) - Math.sqrt(dx * dx + dy * dy);
  return rv > pv ? rv : pv;
}

const SIMC = 5, SW = 270, SH = 170;           // ripple grid: 5 world units per cell
let simA = new Float32Array(SW * SH), simB = new Float32Array(SW * SH);
let simMask = new Uint8Array(SW * SH);
let simX0 = 1e9, simY0 = 1e9, simLive = 0, simHasWater = false, simAcc = 0;
function simRecentre(cx, cy) {
  const nx0 = Math.round(cx / SIMC - SW / 2) * SIMC, ny0 = Math.round(cy / SIMC - SH / 2) * SIMC;
  const dx = Math.round((nx0 - simX0) / SIMC), dy = Math.round((ny0 - simY0) / SIMC);
  const na = new Float32Array(SW * SH), nb = new Float32Array(SW * SH);
  if (simLive > 0 && Math.abs(dx) < SW && Math.abs(dy) < SH) {
    for (let j = 0; j < SH; j++) {
      const jo = j + dy; if (jo < 0 || jo >= SH) continue;
      for (let i = 0; i < SW; i++) {
        const io = i + dx; if (io < 0 || io >= SW) continue;
        na[j * SW + i] = simA[jo * SW + io]; nb[j * SW + i] = simB[jo * SW + io];
      }
    }
  }
  simA = na; simB = nb; simX0 = nx0; simY0 = ny0;
  simHasWater = false;
  for (let j = 0; j < SH; j++) {
    const y = simY0 + (j + 0.5) * SIMC;
    for (let i = 0; i < SW; i++) {
      const x = simX0 + (i + 0.5) * SIMC;
      const m = waterField(x, y) > 0 && pathField(x, y) < 0.55 ? 1 : 0;

  const ci = Math.floor((x - simX0) / SIMC), cj = Math.floor((y - simY0) / SIMC);
  for (let j = cj - rad; j <= cj + rad; j++) {
    if (j < 1 || j >= SH - 1) continue;
    for (let i = ci - rad; i <= ci + rad; i++) {
      if (i < 1 || i >= SW - 1) continue;
      const d = Math.hypot(i - ci, j - cj);
      if (d > rad) continue;
      const k = j * SW + i;
      if (simMask[k]) simA[k] += amt * (1 - d / (rad + 1));
    }
  }

}

  const a = simA, b = simB;
  for (let j = 1; j < SH - 1; j++) {
    let k = j * SW + 1;
    for (let i = 1; i < SW - 1; i++, k++) {
      if (!simMask[k]) { b[k] = 0; continue; }
      // damped wave equation; C² = 0.3 keeps the rings slow and readable
      b[k] = (2 * a[k] - b[k] + 0.3 * (a[k - 1] + a[k + 1] + a[k - SW] + a[k + SW] - 4 * a[k])) * 0.975;

/* Cypress silhouette half-width profile along its height, u in [0,1] */
function prof(u) {
  if (u <= 0 || u >= 1) return 0;
  const a = u < 0.2 ? Math.sqrt(u / 0.2) : 1;
  return a * Math.pow(1 - u, 0.85) * 1.2;
}

/* ── The wanderer ─────────────────────────────────────────── */
const fig = { x: SPAWN.x, y: SPAWN.y, tx: null, ty: null, facing: 1, phase: 0, moving: false, inWater: false, splashT: 0 };
const FS = 1.25; // figure scale
let FB = 0, FK = 0; // side outputs: brightness, kind (0 body, 1 lantern)
let flicker = 1;
function figSample(wx, wy) {
  const lx = (wx - fig.x) * fig.facing / FS, ly = (wy - fig.y) / FS;
  if (ly > 2 || ly < -92 || lx < -26 || lx > 30) return false;
  const bob = fig.moving ? Math.abs(Math.sin(fig.phase)) * 2.2 : 0;
  const yy = ly + bob;
  if (fig.inWater && yy > -20) return false; // wading: legs are under the surface
  const ldx = lx - 20, ldy = yy + 33;
  if (ldx * ldx + ldy * ldy < 34) { FK = 1; FB = 0.8 + 0.2 * flicker; return true; }
  const hx = lx - 1, hy = yy + 80;
  if (hx * hx + hy * hy < 105) { FK = 0; FB = 0.92 - 0.035 * hx + 0.02 * hy; return true; }
  if (yy >= -71 && yy <= -8) {
    const t = (yy + 71) / 63;
    const sway = fig.moving ? Math.sin(fig.phase) * 3.5 * t : 0;
    const hw = 8 + 12.5 * t;
    const cx = lx - sway;
    if (cx > -hw && cx < hw) {
      FK = 0; FB = 0.8 - 0.32 * (cx / hw) - 0.25 * t + 0.07 * Math.sin(cx * 0.9 + yy * 0.2);
      return true;
    }
  }
  if (yy > -50 && yy < -34 && lx > 7 && lx < 20) {
    const ay = -47 + 10 * ((lx - 7) / 13);
    if (Math.abs(yy - ay) < 3) { FK = 0; FB = 0.62; return true; }
  }
  if (yy > -10 && yy <= 0) {
    const s = fig.moving ? Math.sin(fig.phase) * 5 : 0;
    if (Math.abs(lx + 5 - s) < 3.2 || Math.abs(lx - 5 + s) < 3.2) { FK = 0; FB = 0.42; return true; }
  }
  return false;
}

          const px = wx - fig.x, py = wy - fig.y;
          const u = (px * SUN_X + py * SUN_Y) / (95 * FS);
          if (u > 0 && u < 1 && Math.abs(-px * SUN_Y + py * SUN_X) < 15 * FS * prof(u) + 2) figOv[o] = -1;
        }
      }
    }
  }

  const lantX = fig.x + 20 * FS * fig.facing, lantY = fig.y - 6;
  const lci = lantX / cw - gx0 - 0.5, lcj = lantY / cw - gy0 - 0.5;
  const lr = LANT_R / cw, lr2 = lr * lr, lscale = 256 / lr2;
  const li0 = Math.max(0, Math.floor(lci - lr)), li1 = Math.min(cols - 1, Math.ceil(lci + lr));
  const lj0 = Math.max(0, Math.floor(lcj - lr)), lj1 = Math.min(rows - 1, Math.ceil(lcj + lr));
  const lantAmp = 0.6 * flicker;

  const wind = reduceMotion ? 0 : 1;
  const bladeLen = CELL * 1.5 * Math.min(1.9, Math.max(0.75, z));
  const tw = T * 1.25, tw2 = T * 0.54 + 1.7;
  const tgx = fig.tx !== null ? Math.round(fig.tx / cw - 0.5) : 1e9, tgy = fig.tx !== null ? Math.round(fig.ty / cw - 0.5) : 1e9;
  const simOn = simLive > 0;

  sN = 0; gN = 0;
  const kind = F.kind, sbA = F.sb, lkA = F.lk, angA = F.ang, ampA = F.amp, phA = F.ph, lenA = F.len, glA = F.gl, palA = F.pal;

  for (let j = 0; j < rows; j++) {
    const sy = SYA[j], row = j * cols;
    const inFigRow = j >= fj0 && j <= fj1, inLantRow = j >= lj0 && j <= lj1;
    const ldj = j - lcj;
    for (let i = 0; i < cols; i++) {
      const c = row + i;
      let shade = 1;
      if (inFigRow && i >= fi0 && i <= fi1) {
        const o = figOv[(j - fj0) * fw + (i - fi0)];
        if (o > 0) { G(SXA[i], sy, (o & 0xffff) - 1, o >>> 16); continue; }
        if (o < 0) shade = 0.37;
      }
      const k = kind[c];
      if (k === 0) continue;
      const sx = SXA[i];
      if (gx0 + i === tgx && gy0 + j === tgy) { G(sx, sy, CHAR_IX["×"], 4 * LEVELS + 7); continue; }

      let L = sbA[c] * VIG[c] * shade;
      if (inLantRow && i >= li0 && i <= li1) {
        const ldi = i - lci, d2 = (ldi * ldi + ldj * ldj) * lscale;
        if (d2 < 256) L += lkA[c] * lantAmp * LANT[d2 | 0];
      }

      if (k <= K_MOSS) { // strokes: grass, tree, moss
        if (k === K_GRASS && L < 0.05) continue;
        const ph = phA[c];
        const ang = angA[c] + wind * ampA[c] * (SIN[((tw + ph) * SK) & 4095] + 0.45 * SIN[((tw2 + ph * 1.9) * SK) & 4095]);
        const len = bladeLen * lenA[c] * 0.5;
        const cx = Math.cos(ang) * len, cy = Math.sin(ang) * len;
        const bi = L >= 1 ? NB - 1 : (L * NB) | 0;
        S(sx - cx, sy - cy, sx + cx, sy + cy, (k - 1) * NB + bi);
        continue;
      }
      if (k === K_GLYPH) {
        const lv = L >= 0.999 ? LEVELS - 1 : (L * LEVELS) | 0;
        if (lv >= 1) G(sx, sy, glA[c], palA[c] * LEVELS + lv);
        continue;
      }
      if (k === K_WATER) {
        const wx = (gx0 + i + 0.5) * cw, wy = (gy0 + j + 0.5) * cw;
        let hgt = 0, slope = 0;
        if (simOn) {
          const si = ((wx - simX0) / SIMC) | 0, sj = ((wy - simY0) / SIMC) | 0;
          if (si > 0 && si < SW - 1 && sj > 0 && sj < SH - 1) {
            const q = sj * SW + si;
            hgt = simA[q];
            slope = (simA[q - 1] - simA[q + 1]) + (simA[q - SW] - simA[q + SW]);
          }
        }
        const ph = phA[c];
        if (glA[c] !== NONE) { // lily pad, bobbing on the ripples
          const lv = Math.max(2, Math.min(LEVELS - 1, ((0.55 + hgt * 0.3) * L * LEVELS) | 0));
          G(sx, sy, glA[c], 8 * LEVELS + lv);
          continue;
        }
        const shore = lenA[c];
        if (shore < 11 + 6 * SIN[((T * 1.7 + ph) * SK) & 4095] + Math.abs(hgt) * 8) { // foam along the bank
          const b = (0.75 + 0.35 * SIN[((T * 3 + ph) * SK) & 4095] + Math.abs(slope) * 0.4) * L * 1.25;
          const lv = Math.min(LEVELS - 1, (b * LEVELS) | 0);
          if (lv >= 1) G(sx, sy, FOAM_IX[(ph * 0.8) | 0], 7 * LEVELS + lv);
          continue;
        }
        const wave = SIN[((wx * 0.045 + T * 1.1 + 2.2 * SIN[((wy * 0.03 - T * 0.6) * SK) & 4095]) * SK) & 4095];
        const streak = ampA[c] * (0.65 + 0.35 * SIN[((T * 1.6 + ph) * SK) & 4095]);
        const ripple = slope * 1.9 + hgt * 0.3;                // lit crests, darker troughs
        const v = Math.max(0.16, 0.3 + 0.13 * wave + streak + ripple);
        const gi = Math.abs(ripple) > 0.22 ? (ripple > 0 ? 6 : 4) : Math.max(1, Math.min(6, (v * WATER_IX.length) | 0));
        const lv = Math.max(1, Math.min(LEVELS - 1, ((v * 1.3 + Math.max(0, ripple) * 1.4) * L * LEVELS) | 0));
        if (lv >= 1) G(sx, sy, WATER_IX[gi], 6 * LEVELS + lv);
        continue;
      }
      if (k === K_MARK) {
        const m = MARKERS[palA[c]];
        if (lenA[c] === 1) { G(sx, sy, CHAR_IX["+"], 4 * LEVELS + 11); continue; }
        const b = 0.45 + 0.35 * Math.sin(angA[c] * 3 - T * 1.8) + 0.2 * m.glow;
        G(sx, sy, CHAR_IX[b > 0.6 ? "*" : "·"], 4 * LEVELS + Math.max(2, Math.min(11, b * 11 | 0)));
      }
    }
  }

  /* Draw */
  const lwBase = Math.max(0.75, 0.95 * Math.sqrt(z) * CELL / 7);
  const widths = [lwBase, lwBase * 1.45, lwBase * 1.2];
  if (gpu) gpu.draw(widths); else draw2d(widths);

  /* Fireflies + lantern bloom (separate overlay canvas) */
  fx.setTransform(1, 0, 0, 1, 0, 0);
  fx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  fx.globalCompositeOperation = "lighter";
  fx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const vw = W / z, vh = H / z;
  for (const f of flies) {
    if (!reduceMotion) {
      f.x += (vnoise(f.s, T * 0.3, 21) - 0.5) * 40 * dt;
      f.y += (vnoise(f.s, T * 0.3, 22) - 0.5) * 40 * dt - 4 * dt;
    }
    if (f.x < cam.x - vw * 0.6) f.x += vw * 1.2; else if (f.x > cam.x + vw * 0.6) f.x -= vw * 1.2;
    if (f.y < cam.y - vh * 0.6) f.y += vh * 1.2; else if (f.y > cam.y + vh * 0.6) f.y -= vh * 1.2;
    const a = reduceMotion ? 0.5 : Math.max(0, Math.sin(T * (0.6 + (f.s % 1)) + f.s));
    if (a < 0.05) continue;
    const [px, py] = toScreen(f.x, f.y);
    fx.globalAlpha = a * 0.75;
    const sz = 7 + 4 * a;
    fx.drawImage(glow, px - sz / 2, py - sz / 2, sz, sz);
  }
  {
    const [px, py] = toScreen(fig.x + 20 * FS * fig.facing, fig.y - 33 * FS);
    fx.globalAlpha = 0.3 * flicker;
    const sz = 70 * z;
    fx.drawImage(glow, px - sz / 2, py - sz / 2, sz, sz);
  }
  fx.globalAlpha = 1;

  /* HTML labels */
  {
    const [px, py] = toScreen(fig.x, fig.y);
    nametag.style.transform = `translate(${Math.round(px)}px, ${Math.round(py + 14)}px) translateX(-50%)`;
  }
  for (const m of MARKERS) {
    const [px, py] = toScreen(m.x, m.y - 40);
    const lift = Math.round(8 + 6 * z);
    const on = px > -100 && px < W + 100 && py > -40 && py < H + 40;
    m.el.style.visibility = on ? "visible" : "hidden";
    if (on) m.el.style.transform = `translate(${Math.round(px)}px, ${Math.round(py) - lift}px) translate(-50%, -100%)`;
  }
  {
    const [px, py] = toScreen(DOOR.x, TOWER.y - 132);
    const on = px > -100 && px < W + 100 && py > -40 && py < H + 60;
    towerLabel.style.visibility = on ? "visible" : "hidden";
    if (on) towerLabel.style.transform = `translate(${Math.round(px)}px, ${Math.round(py)}px) translate(-50%, -100%)`;
  }
  coordsEl.textContent = `x ${String(Math.round(fig.x / 10)).padStart(4, " ")}  y ${String(Math.round(-fig.y / 10)).padStart(4, " ")}  ·  ${z.toFixed(2)}×`;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if (matchMedia("(hover: none)").matches) document.getElementById("hint").textContent = "tap to walk · follow the lights";
})();
</script>
